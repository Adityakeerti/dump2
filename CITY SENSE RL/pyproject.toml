[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "citysense"
version = "0.1.0"
description = "CitySense Traffic: CTM-based traffic twin with causal tracing and RL policy"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
