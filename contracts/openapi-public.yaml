      properties:
        type:
          type: string
          enum:
          - cv_density
          - complaint
          - flood
          - crash
          - event
          - agent_finding
          - rain
          - congestion
        latitude:
          maximum: 90
          exclusiveMaximum: false
          minimum: -90
          exclusiveMinimum: false
          type: number
          format: double
        longitude:
          maximum: 180
          exclusiveMaximum: false
          minimum: -180
          exclusiveMinimum: false
          type: number
          format: double
        observedAt:
          type: string
          format: date-time
        source:
          maxLength: 64
          minLength: 0
          type: string
        confidence:
          maximum: 1
          exclusiveMaximum: false
          minimum: 0
          exclusiveMinimum: false
          type: number
          format: double
        status:
          type: string
          enum:
          - UNVERIFIED
          - VERIFIED
          - SIMULATED
          - PREDICTED
          - STALE
        payload:
          type: object
          additionalProperties:
            type: object
    IngestResponse:
      type: object
      properties:
        observation:
          $ref: "#/components/schemas/ObservationView"
        incidentId:
          type: string
          format: uuid
